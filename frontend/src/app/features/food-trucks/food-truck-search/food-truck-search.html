<div class="search-container">

  <div class="search-input-wrapper">

    <span class="search-icon">🔍</span>

    <input
      type="text"
      placeholder="Search food trucks or food..."
      [value]="searchValue()"
      (input)="onSearchChange($event)"
      (keyup.enter)="onSearch()"
    />

    @if (searchValue()) {
      <button
        type="button"
        class="clear-button"
        (click)="clearSearch()">
        ✕
      </button>
    }

  </div>

  <button
    type="button"
    class="search-button"
    (click)="onSearch()">
    Search
  </button>

</div>
